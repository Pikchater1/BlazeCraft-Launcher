name: BlazeCraft Frontend Check

on:
  pull_request:
    paths:
      - 'apps/app-frontend/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/blazecraft-frontend-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack
        run: corepack enable
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build launcher frontend
        run: pnpm turbo run build --filter=@modrinth/app-frontend
